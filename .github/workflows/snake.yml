# GitHub Action to generate snake animation from contribution graph
name: Generate Snake Animation

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Contribution density is encoded along the profile's neutral ink
          # ramp, not a category colour: the portfolio reserves colour for
          # things you can interact with, and a contribution graph is not one.
          # Tokens are the site's own, mirrored in tools/build_svg.py.
          outputs: |
            dist/github-snake.svg?color_snake=%233b3f49&color_dots=%23e6e7ea,%23d3d5da,%239498a1,%23666b75,%2314161c
            dist/github-snake-dark.svg?color_snake=%23c2c6cd&color_dots=%2324272e,%23343841,%23656a74,%238a8f99,%23eceff0

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
